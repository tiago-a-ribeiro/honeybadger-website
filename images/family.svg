<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 130" role="img">
  <title>The honey badger is in the weasel family, with otters, wolverines, and weasels.</title>
<rect x="140" y="5" width="140" height="34" rx="17" fill="#ffcf6e"/>
  <text x="210" y="28" text-anchor="middle" font-size="14" font-family="system-ui, -apple-system, sans-serif" font-weight="700" fill="#1d1b18">Weasel family</text>
  <line x1="210" y1="39" x2="55" y2="80" stroke="#1d1b18" stroke-width="2"/><line x1="210" y1="39" x2="160" y2="80" stroke="#1d1b18" stroke-width="2"/><line x1="210" y1="39" x2="260" y2="80" stroke="#1d1b18" stroke-width="2"/><line x1="210" y1="39" x2="365" y2="80" stroke="#1d1b18" stroke-width="2"/>
  <rect x="5" y="80" width="100" height="34" rx="17" fill="#1d1b18"/><text x="55" y="102" text-anchor="middle" font-size="13" font-family="system-ui, -apple-system, sans-serif" font-weight="700" fill="#fff">Honey badger</text><rect x="110" y="80" width="100" height="34" rx="17" fill="#e8e4d8"/><text x="160" y="102" text-anchor="middle" font-size="13" font-family="system-ui, -apple-system, sans-serif" font-weight="700" fill="#1d1b18">Otter</text><rect x="210" y="80" width="100" height="34" rx="17" fill="#e8e4d8"/><text x="260" y="102" text-anchor="middle" font-size="13" font-family="system-ui, -apple-system, sans-serif" font-weight="700" fill="#1d1b18">Wolverine</text><rect x="315" y="80" width="100" height="34" rx="17" fill="#e8e4d8"/><text x="365" y="102" text-anchor="middle" font-size="13" font-family="system-ui, -apple-system, sans-serif" font-weight="700" fill="#1d1b18">Weasel</text>
</svg>
