  <rect x="170" y="35" width="45" height="65" rx="22" fill="#f1c27d"/>
  <rect x="178" y="40" width="29" height="22" rx="10" fill="#fbe3c4"/>
  <text x="85" y="20" text-anchor="middle" font-size="13" font-family="system-ui, -apple-system, sans-serif" font-weight="700" fill="#1d1b18">Claw</text>
