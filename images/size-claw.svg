  <line x1="30" y1="110" x2="30" y2="128" stroke="#1d1b18" stroke-width="2"/><line x1="50" y1="110" x2="50" y2="122" stroke="#1d1b18" stroke-width="2"/><line x1="70" y1="110" x2="70" y2="128" stroke="#1d1b18" stroke-width="2"/><line x1="90" y1="110" x2="90" y2="122" stroke="#1d1b18" stroke-width="2"/><line x1="110" y1="110" x2="110" y2="128" stroke="#1d1b18" stroke-width="2"/><line x1="130" y1="110" x2="130" y2="122" stroke="#1d1b18" stroke-width="2"/><line x1="150" y1="110" x2="150" y2="128" stroke="#1d1b18" stroke-width="2"/><line x1="170" y1="110" x2="170" y2="122" stroke="#1d1b18" stroke-width="2"/><line x1="190" y1="110" x2="190" y2="128" stroke="#1d1b18" stroke-width="2"/><line x1="210" y1="110" x2="210" y2="122" stroke="#1d1b18" stroke-width="2"/><line x1="230" y1="110" x2="230" y2="128" stroke="#1d1b18" stroke-width="2"/><line x1="250" y1="110" x2="250" y2="122" stroke="#1d1b18" stroke-width="2"/><line x1="270" y1="110" x2="270" y2="128" stroke="#1d1b18" stroke-width="2"/>
