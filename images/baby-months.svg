<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 110" role="img">
  <title>A honey badger baby grows inside its mom for about 2 months. A human baby takes 9 months.</title>
<text x="10" y="42" font-size="14" font-family="system-ui, -apple-system, sans-serif" font-weight="700" fill="#1d1b18">Honey badger</text>
  <rect x="150" y="25" width="24" height="24" rx="4" fill="#ffcf6e"/><rect x="178" y="25" width="24" height="24" rx="4" fill="#ffcf6e"/>
  <text x="10" y="86" font-size="14" font-family="system-ui, -apple-system, sans-serif" font-weight="700" fill="#1d1b18">Human baby</text>
  <rect x="150" y="69" width="24" height="24" rx="4" fill="#7da7d9"/><rect x="178" y="69" width="24" height="24" rx="4" fill="#7da7d9"/><rect x="206" y="69" width="24" height="24" rx="4" fill="#7da7d9"/><rect x="234" y="69" width="24" height="24" rx="4" fill="#7da7d9"/><rect x="262" y="69" width="24" height="24" rx="4" fill="#7da7d9"/><rect x="290" y="69" width="24" height="24" rx="4" fill="#7da7d9"/><rect x="318" y="69" width="24" height="24" rx="4" fill="#7da7d9"/><rect x="346" y="69" width="24" height="24" rx="4" fill="#7da7d9"/><rect x="374" y="69" width="24" height="24" rx="4" fill="#7da7d9"/>
  <text x="215" y="42" font-size="13" font-family="system-ui, -apple-system, sans-serif" font-weight="700" fill="#1d1b18">2 months</text>
</svg>
